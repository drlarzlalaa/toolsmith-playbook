[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "{{pkg}}"
version = "0.1.0"
description = "{{description}}"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "drlarzlalaa" }]
keywords = [{{keywords}}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.scripts]
{{pkg}} = "{{pkg}}.__main__:main"

[tool.setuptools]
packages = ["{{pkg}}"]
